# =============================================================================
# HazardLensAI — Render Blueprint
# (api web service + celery worker + managed postgres + redis + ml inference)
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
# Render auto-detects render.yaml at the repo root (copy/keep at root; this
# file lives at deploy/render.yaml — reference it from the root when deploying
# or move it to the root at deploy time).
#
# POSTGIS: Render's managed Postgres ships the PostGIS extension. Run ONCE
# after the first boot (Render dashboard → database → psql shell, or locally):
#   CREATE EXTENSION IF NOT EXISTS postgis;
# DATABASE_URL from `fromDatabase.connectionString` is a plain
# `postgresql://...` URI — the FastAPI engine normalizes it to
# `postgresql+psycopg://...` (see backend/config); no manual edit needed.
# =============================================================================

envVarGroups:
  - name: roadguard-object-storage
    envVars:
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT            # e.g. https://<accountid>.r2.cloudflarestorage.com or empty for AWS
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: roadguard-media
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
  - name: roadguard-observability
    envVars:
      - key: SENTRY_DSN             # placeholder — set in the dashboard, never commit
        sync: false
      - key: MLFLOW_TRACKING_URI    # self-hosted MLflow URL or a managed instance
        sync: false

databases:
  - name: roadguard-postgres
    databaseName: roadguard
    user: roadguard
    plan: basic-256mb
    postgresMajorVersion: "16"
    # Attach the PostGIS extension once (see header comment).

services:
  # ---------------------------------------------------------------- API (web)
  - type: web
    name: roadguard-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: roadguard-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: roadguard-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true        # rotated only on explicit regenerate
      - key: JWT_ACCESS_TTL_MINUTES
        value: "15"
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: CORS_ORIGINS
        value: https://roadguard-atlas.vercel.app   # change to your frontend URL
      - key: INFERENCE_SERVICE_URL
        fromService:
          type: web
          name: roadguard-ml-inference
          property: host
      - key: UPLOAD_DIR
        value: /tmp/uploads        # ephemeral on Render; use STORAGE_BACKEND=s3
      - key: SENTRY_DSN
        sync: false
      - key: MLFLOW_TRACKING_URI
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # ------------------------------------------------------------- Celery worker
  - type: worker
    name: roadguard-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roadguard-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: roadguard-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: INFERENCE_SERVICE_URL
        fromService:
          type: web
          name: roadguard-ml-inference
          property: host
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # ----------------------------------------------------------------- Inference
  - type: web
    name: roadguard-ml-inference
    runtime: docker
    rootDir: ml
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MODEL_PATH
        value: /models/best.onnx
      - key: INFERENCE_DEVICE
        value: cpu

  # --------------------------------------------------------------------- Redis
  - type: redis
    name: roadguard-redis
    plan: starter
    maxmemoryPolicy: noeviction    # celery broker must not evict silently
    ipAllowList: []                # internal-only (reachable from services above)
