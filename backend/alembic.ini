[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

# The URL is overridden from app.config.settings (DATABASE_URL) inside alembic/env.py.
# Example:
#   sqlalchemy.url = postgresql+psycopg://roadguard:roadguard@localhost:5432/roadguard
sqlalchemy.url = postgresql+psycopg://roadguard:roadguard@localhost:5432/roadguard

[post_write_hooks]
# format migrations with black (optional; ignored if black is not installed)
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = --skip-string-normalization --line-length 120 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
