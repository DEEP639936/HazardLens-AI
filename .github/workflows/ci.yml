name: CI

# RoadGuard Atlas — continuous integration
# frontend (bun) · backend (FastAPI) · ml (YOLO) · docker/compose validation.
# Backend/ML jobs self-skip (hashFiles guards) until their folders land, so
# CI stays green from day one and activates automatically.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------- Frontend
  frontend:
    name: Frontend (bun · lint · typecheck · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (eslint)
        run: bun run lint

      - name: Typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Build (next build → standalone)
        run: bun run build
        env:
          # Build-time placeholder only — no runtime queries during build.
          DATABASE_URL: "file:./db/custom.db"

  # ------------------------------------------------------------------ Backend
  backend:
    name: Backend (python 3.11 · ruff · pytest)
    runs-on: ubuntu-latest
    # Skips until backend/agent lands requirements.txt
    if: ${{ hashFiles('backend/requirements.txt') != '' }}
    env:
      # SQLite fallback: the backend test suite adapts the engine when
      # DATABASE_URL is a sqlite:// URI (see backend/README.md).
      DATABASE_URL: "sqlite:///./ci-backend.db"
      REDIS_URL: "redis://localhost:6379/0"
      JWT_SECRET: "ci-only-secret-not-used-in-production-0123456789"
      STORAGE_BACKEND: "local"
      UPLOAD_DIR: "/tmp/uploads"
      INFERENCE_SERVICE_URL: "http://localhost:8100"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "ruff>=0.6" pytest

      - name: Lint (ruff)
        run: ruff check backend

      - name: Test (pytest)
        run: pytest backend/tests -q --tb=short

  # ----------------------------------------------------------------------- ML
  ml:
    name: ML (python 3.10 · ruff · pytest)
    runs-on: ubuntu-latest
    # Skips until ml/agent lands requirements.txt
    if: ${{ hashFiles('ml/requirements.txt') != '' }}
    env:
      # Light-CI mode: ml/tests skip model downloads & GPU paths via
      # pytest.importorskip / this flag when heavy deps are unavailable.
      ML_CI_LIGHT: "1"
      MODEL_PATH: "/tmp/rg-ci-model.onnx"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies (graceful on heavy extras)
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt || \
            echo "::warning::ml/requirements.txt install failed — tests must importorskip heavy deps"
          pip install "ruff>=0.6" pytest

      - name: Lint (ruff)
        run: ruff check ml

      - name: Test (pytest — heavy deps are importorskipped)
        run: pytest ml/tests -q --tb=short

  # ------------------------------------------------------- Docker / compose
  docker:
    name: Docker (compose config · hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config -q

      - name: Lint deploy manifests (json/yaml)
        run: |
          python3 -m json.tool deploy/vercel.json > /dev/null
          python3 - <<'PY'
          import sys, pathlib
          try:
              import yaml
          except ImportError:
              sys.exit("PyYAML unavailable on runner (unexpected)")
          for f in ("docker-compose.yml", "deploy/render.yaml"):
              yaml.safe_load(pathlib.Path(f).read_text())
              print(f"OK  {f}")
          PY

      # Optional lint of Dockerfiles — non-blocking (informational only).
      - name: Hadolint (optional, non-blocking)
        continue-on-error: true
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 \
            && chmod +x /usr/local/bin/hadolint \
            && hadolint infrastructure/docker/frontend.Dockerfile infrastructure/docker/worker.Dockerfile
